services:
  - type: web
    name: vton-mvp-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VTON_PROVIDER
        value: auto
      - key: DISABLE_REMBG
        value: "true"
      - key: PUBLIC_BACKEND_URL
        value: https://vton-mvp-api.onrender.com
      - key: VTON_USE_HUMANIZED_PERSON
        value: "true"
      - key: VTON_REPLACE_MOCK_PERSON_FOR_EXTERNAL
        value: "true"
      - key: VTON_MOCK_BODY_STYLE
        value: premium_gray
      - key: REPLICATE_MODEL
        value: cuuupid/idm-vton
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_POLL_TIMEOUT_SECONDS
        value: "180"
      - key: REPLICATE_POLL_INTERVAL_SECONDS
        value: "3"
      - key: HF_API_TOKEN
        sync: false
      - key: HF_SPACE_ID
        value: Pinhoabacaxi/IDM-VTON
      - key: HF_SPACE_API_NAME
        value: /tryon
      - key: HF_DENOISE_STEPS
        value: "30"
      - key: HF_SEED
        value: "42"
      - key: HF_GARMENT_DESCRIPTION
        value: clothing item for virtual try-on
      - key: HF_NORMALIZE_INPUTS
        value: "true"
      - key: HF_PERSON_WIDTH
        value: "768"
      - key: HF_PERSON_HEIGHT
        value: "1024"
      - key: HF_SKIP_FOR_MOCK_PERSON
        value: "false"
      - key: HF_REJECT_SIMPLE_PERSON
        value: "true"
      - key: HF_IMAGE_MAX_BYTES
        value: "2097152"
