services:
  - type: web
    name: vton-mvp-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DISABLE_REMBG
        value: "true"
      - key: PUBLIC_BACKEND_URL
        sync: false
