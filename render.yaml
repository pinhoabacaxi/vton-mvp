services:
  - type: web
    name: vton-mvp-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VTON_PROVIDER
        value: auto
      - key: DISABLE_REMBG
        value: "true"
      - key: PUBLIC_BACKEND_URL
        value: https://vton-mvp-api.onrender.com
      - key: REPLICATE_MODEL
        value: cuuupid/idm-vton
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_POLL_TIMEOUT_SECONDS
        value: "180"
      - key: REPLICATE_POLL_INTERVAL_SECONDS
        value: "3"
